[package]
name = "goo2d_kernel"
version = "0.2.0"
edition = "2021"
description = "Goo2D's native kernel: the goo's per-frame math as a Godot GDExtension (godot-rust)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5", features = ["api-4-7"] }
# GooColony's threaded step (src/colony.rs, the colony spike): pure Rust, no C toolchain.
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"

# The colony's CPU timers (colony.rs, CpuClock): the thread CPU clock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
